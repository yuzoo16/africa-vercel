# --- 404 (must remain last: Netlify evaluates top-down) --------------
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404


[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"
